<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thêm/Sửa Sản phẩm</title>
    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="app/css/main.css">
    <style>
        .container {
            max-width: 500px;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 id="formTitle">Thêm sản phẩm</h2>
        <form id="productForm">
            <input type="hidden" name="id" id="productId">
            <div class="form-group">
                <label>Tên sản phẩm</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="form-group">
                <label>Mô tả</label>
                <input type="text" class="form-control" name="description">
            </div>
            <div class="form-group">
                <label>Link ảnh sản phẩm</label>
                <input type="text" class="form-control" name="image" id="image"
                    placeholder="https://example.com/image.jpg">
            </div>


            <div class="form-group">
                <label>Slug</label>
                <input type="text" class="form-control" name="slug">
            </div>
            <div class="form-group">
                <label>Giá</label>
                <input type="number" class="form-control" name="price" required>
            </div>
            <div class="form-group">
                <label>Danh mục</label>
                <select class="form-control" name="categoryId" id="categorySelect" required>
                    <option value="">-- Chọn danh mục --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Brand</label>
                <select class="form-control" name="brandId" id="brandSelect" required>
                    <option value="">-- Chọn brand --</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" id="saveBtn">Lưu</button>
            <a href="IndexProduct.html" class="btn btn-secondary">Quay lại</a>
        </form>
        <div id="formMessage" class="mt-3"></div>
    </div>
    <script>
        // Fetch danh sách category và brand
        function loadCategories() {
            fetch('http://localhost:5443/admin/categorys')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('categorySelect');
                    data.forEach(c => {
                        select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                    });
                });
        }
        function loadBrands() {
            fetch('http://localhost:5443/admin/brands')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('brandSelect');
                    data.forEach(b => {
                        select.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                    });
                });
        }
        loadCategories();
        loadBrands();

        // Lấy id từ query string nếu có (dùng cho edit)
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }
        const apiUrl = "http://localhost:5443/admin/products";
        const productId = getQueryParam('id');
        if (productId) {
            document.getElementById('formTitle').innerText = "Sửa sản phẩm";
            document.getElementById('saveBtn').innerText = "Cập nhật";
            // Load dữ liệu sản phẩm để sửa
            fetch(apiUrl + "/" + productId)
                .then(res => res.json())
                .then(p => {
                    document.getElementById('productId').value = p.id;
                    document.getElementsByName('name')[0].value = p.name;
                    document.getElementsByName('description')[0].value = p.description;
                    document.getElementsByName('image')[0].value = p.image;
                    document.getElementsByName('slug')[0].value = p.slug;
                    document.getElementsByName('price')[0].value = p.price;
                    // Set value cho select theo id, nhưng hiển thị là tên
                    setTimeout(() => {
                        document.getElementById('categorySelect').value = p.category ? p.category.id : '';
                        document.getElementById('brandSelect').value = p.brand ? p.brand.id : '';
                    }, 300); // Đợi select load xong
                });
        }

        document.getElementById('productForm').onsubmit = async function (e) {
            e.preventDefault();
            const form = this;
            const product = {
                name: form.name.value,
                description: form.description.value,
                image: form.image.value,
                slug: form.slug.value,
                price: parseFloat(form.price.value),
                category: { id: parseInt(form.categoryId.value) },
                brand: { id: parseInt(form.brandId.value) }
            };
            let method = "POST";
            let url = apiUrl;
            if (productId) {
                method = "PUT";
                url += "/" + productId;
            }
            const res = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(product)
            });
            if (res.ok) {
                document.getElementById('formMessage').innerText = "Lưu thành công!";
                setTimeout(() => {
                    window.location.href = "IndexProduct.html";
                }, 1000);
            } else {
                document.getElementById('formMessage').innerText = "Có lỗi xảy ra!";
            }
        };
    </script>
    <script>
        // Lấy role từ localStorage
        const roles = JSON.parse(localStorage.getItem("roles") || "[]");

        if (!roles.includes("ROLE_ADMIN")) {
            alert("Bạn không có quyền truy cập trang quản trị!");
            window.location.href = "../login.html"; // Chuyển về login hoặc trang khác
        }

    </script>
</body>

</html>
