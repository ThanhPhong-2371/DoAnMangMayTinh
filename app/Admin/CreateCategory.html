<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thêm/Sửa Danh mục</title>
    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <style>
        .container {
            max-width: 600px;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 id="formTitle">Thêm Danh mục</h2>
        <form id="categoryForm">
            <input type="hidden" name="id" id="categoryId">
            <div class="form-group">
                <label>Tên danh mục</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="form-group">
                <label>Mô tả</label>
                <input type="text" class="form-control" name="description">
            </div>
            <div class="form-group">
                <label>Slug</label>
                <input type="text" class="form-control" name="slug">
            </div>
            <div class="form-group">
                <label>Trạng thái</label>
                <input type="text" class="form-control" name="status">
            </div>
            <button type="submit" class="btn btn-primary" id="saveBtn">Lưu</button>
            <a href="IndexCategory.html" class="btn btn-secondary">Quay lại</a>
        </form>
        <div id="formMessage" class="mt-3"></div>
    </div>
    <script>
        // Lấy role từ localStorage
        const roles = JSON.parse(localStorage.getItem("roles") || "[]");

        if (!roles.includes("ROLE_ADMIN")) {
            alert("Bạn không có quyền truy cập trang quản trị!");
            window.location.href = "../login.html"; // Chuyển về login hoặc trang khác
        }

    </script>
    <script>
        const apiUrl = "http://localhost:5443/admin/categorys";

        // Lấy id từ query string nếu có (edit)
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }
        const categoryId = getQueryParam('id');

        if (categoryId) {
            document.getElementById('formTitle').innerText = "Sửa Danh mục";
            document.getElementById('saveBtn').innerText = "Cập nhật";

            fetch(apiUrl + "/" + categoryId)
                .then(res => res.json())
                .then(c => {
                    document.getElementById('categoryId').value = c.id;
                    document.getElementsByName('name')[0].value = c.name;
                    document.getElementsByName('description')[0].value = c.description;
                    document.getElementsByName('slug')[0].value = c.slug;
                    document.getElementsByName('status')[0].value = c.status;
                });
        }

        document.getElementById('categoryForm').onsubmit = async function (e) {
            e.preventDefault();
            const form = this;
            const category = {
                name: form.name.value,
                description: form.description.value,
                slug: form.slug.value,
                status: form.status.value
            };
            let method = "POST";
            let url = apiUrl;
            if (categoryId) {
                method = "PUT";
                url += "/" + categoryId;
            }
            const res = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(category)
            });
            if (res.ok) {
                document.getElementById('formMessage').innerText = "Lưu thành công!";
                setTimeout(() => {
                    window.location.href = "IndexCategory.html";
                }, 1000);
            } else {
                document.getElementById('formMessage').innerText = "Có lỗi xảy ra!";
            }
        };
    </script>
</body>

</html>
