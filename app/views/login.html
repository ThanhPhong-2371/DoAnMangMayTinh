<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="login-container">
        <h2>Đăng nhập</h2>
        <form id="loginForm">
            <label>Tên đăng nhập:</label>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập" required>

            <label>Mật khẩu:</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>

            <button type="submit">Đăng nhập</button>
        </form>

        <p class="register-link">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </p>

        <div id="loginMessage"></div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async function (e) {
            e.preventDefault();

            const username = this.username.value;
            const password = this.password.value;

            try {
                const res = await fetch("http://localhost:5443/account/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                    credentials: "include" // 🔥 GIỮ SESSION COOKIE
                });

                const data = await res.json();
                document.getElementById("loginMessage").innerText = data.message;
                document.getElementById("loginMessage").style.color = data.success ? "green" : "red";

                if (data.success) {
                    // ✅ Chỉ lưu thông tin để hiển thị frontend
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("userId", data.id);
                    localStorage.setItem("roles", JSON.stringify(data.roles));

                    // ✅ Chuyển sang trang chính
                    setTimeout(() => {
                        window.location.href = "../index.html";
                    }, 1000);
                }
            } catch (error) {
                document.getElementById("loginMessage").innerText = "Không thể kết nối server!";
                document.getElementById("loginMessage").style.color = "red";
            }
        };
    </script>

</body>

</html>
